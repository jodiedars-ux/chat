<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейный Чат</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2300a884%22/><path d=%22M30 35h40v25H45L30 75V35z%22 fill=%22white%22/></svg>">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --bg-color: #efeae2; --header-color: #f0f2f5; --my-msg: #dcf8c6; --their-msg: #ffffff; --accent: #008069; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #d1d7db; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        #login-screen { position: fixed; inset: 0; background: #f0f2f5; display: none; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; }
        .login-btn { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px; margin-top: 10px; border-radius: 12px; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.2s; }
        .login-btn:active { background: #006b58; transform: scale(0.98); }
        .login-btn:disabled { background: #88c7bc; cursor: not-allowed; }
        
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; text-transform: lowercase; }

        #app-screen { display: none; height: 100%; flex-direction: column; width: 100%; max-width: 600px; margin: 0 auto; background: white; }
        
        header { background: var(--header-color); padding: 10px 16px; display: flex; align-items: center; border-bottom: 1px solid #d1d7db; gap: 12px; height: 60px; flex-shrink: 0; }
        .back-btn { font-size: 24px; cursor: pointer; display: none; padding-right: 5px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.3s; }
        
        #contacts-list { flex: 1; overflow-y: auto; background: white; }
        .contact-item { padding: 12px 20px; border-bottom: 1px solid #f2f2f2; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .contact-item:active { background: #f0f2f5; }
        
        #chat-window { display: none; flex: 1; flex-direction: column; background: var(--bg-color); position: relative; overflow: hidden; }
        #chat-window::before { content: ""; position: absolute; inset: 0; background-image: url('https://web.whatsapp.com/img/bg-chat-tile-dark_a4be512e7195b6b733d9110b408f075d.png'); opacity: 0.05; }
        
        #typing-indicator { position: absolute; top: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); padding: 5px 20px; font-size: 13px; color: var(--accent); font-weight: 500; z-index: 5; display: none; }

        #messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; word-wrap: break-word; }
        .msg.sent { background: var(--my-msg); align-self: flex-end; border-top-right-radius: 0; }
        .msg.received { background: var(--their-msg); align-self: flex-start; border-top-left-radius: 0; }
        .msg-time { font-size: 10px; color: #667781; margin-top: 4px; text-align: right; display: block; }

        .input-bar { background: #f0f2f5; padding: 8px 12px; display: flex; align-items: center; gap: 8px; z-index: 10; flex-shrink: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
        #msg-input { flex: 1; padding: 10px 15px; border: none; border-radius: 20px; font-size: 16px; outline: none; }
        .send-btn { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        
        #emoji-picker { display: none; background: #f0f2f5; padding: 10px; max-height: 250px; overflow-y: auto; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 10px; border-top: 1px solid #ddd; z-index: 10; flex-shrink: 0; }
.emoji-item { font-size: 28px; cursor: pointer; text-align: center; transition: 0.1s; user-select: none; -webkit-tap-highlight-color: transparent; }
.emoji-item:active { transform: scale(1.2); }
        
        .badge { background: #25D366; color: white; border-radius: 50%; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; padding: 0 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="margin-bottom: 20px; color: var(--accent);">Вход в чат</h2>
            <input type="text" id="auth-email" class="auth-input" placeholder="Логин (mama, papa, son)">
            <input type="password" id="auth-pass" class="auth-input" placeholder="Пароль">
            <button id="auth-submit-btn" class="login-btn" onclick="authLogin()">Войти</button>
            <div id="auth-error" style="color: #e74c3c; font-size: 14px; margin-top: 15px; display: none;"></div>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div class="back-btn" id="back-btn" onclick="closeChat()">←</div>
            <div class="avatar" id="header-avatar">👤</div>
            <div style="flex:1">
                <b id="header-name">Семейный Чат</b><br>
                <small id="header-status" style="color: #667781;">в сети</small>
            </div>
            <button onclick="logout()" style="background:none; border:none; color:#e74c3c; font-size:14px; font-weight:bold; cursor:pointer;">Выйти</button>
        </header>

        <div id="contacts-list"></div>

        <div id="chat-window">
            <div id="typing-indicator">печатает...</div>
            <div id="messages-container"></div>
            
            <div id="emoji-picker"></div>
            
            <div class="input-bar">
                <input type="file" id="img-upload" accept="image/*" style="display: none;" onchange="uploadImage(event)">
                <label for="img-upload" style="font-size: 24px; cursor: pointer; padding: 0 5px;">📎</label>
                
                <span id="emoji-btn" style="font-size: 26px; cursor: pointer; padding: 0 10px;" onclick="toggleEmojiPicker()">😀</span>
                
                <input type="text" id="msg-input" placeholder="Сообщение..." autocomplete="off">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB0p9d7o99HZzqtf1KjhFT2_xkh3D0-3qY",
      authDomain: "chat-dd013.firebaseapp.com",
      databaseURL: "https://chat-dd013-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chat-dd013",
      storageBucket: "chat-dd013.firebasestorage.app",
      messagingSenderId: "572123309303",
      appId: "1:572123309303:web:89495490090b69b6589ff2"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myId = localStorage.getItem('family_chat_user'); 
    let activeTarget = null;
    let onlineUsers = {}; 
    let allMessages = [];
    let unreadCounts = {};
    let isInitialLoad = true;
    let audioCtx;
    let typingTimer, ghostBusterTimer, isTypingNow = false; 

    const users = { 'mama': {n:'Мама', i:'👩'}, 'papa': {n:'Папа', i:'👨'}, 'son': {n:'Сын', i:'👦'} };

    // Разблокировка звука
    document.body.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });

    function checkAuth() {
        if (myId && users[myId]) showApp();
        else document.getElementById('login-screen').style.display = 'flex';
    }
    checkAuth();

    async function authLogin() {
        const loginVal = document.getElementById('auth-email').value.trim().toLowerCase();
        const passVal = document.getElementById('auth-pass').value.trim();
        const btn = document.getElementById('auth-submit-btn');
        const errDiv = document.getElementById('auth-error');
        
        if (!loginVal || !passVal) return;
        btn.disabled = true;

        try {
            const snap = await db.ref('family_access/' + loginVal).once('value');
            const userData = snap.val();
            if (userData && String(userData) === passVal) {
                localStorage.setItem('family_chat_user', loginVal);
                location.reload(); 
            } else {
                errDiv.innerText = 'Неверный логин или пароль';
                errDiv.style.display = 'block';
            }
        } catch (e) { errDiv.style.display = 'block'; }
        btn.disabled = false;
    }

    function logout() { 
        localStorage.removeItem('family_chat_user');
        if(myId) db.ref('status/' + myId).remove();
        location.reload(); 
    }

    function playPopSound() {
        try {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch(e){}
    }

    function showNotification(title, text) {
        if (Notification.permission === 'granted') {
            new Notification(title, { body: text.startsWith('data:image') ? '📷 Фотография' : text, icon: 'https://cdn-icons-png.flaticon.com/512/1041/1041916.png' });
        }
    }

    function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        
        // --- ЗАПУСКАЕМ ОЧИСТКУ СТАРЫХ СООБЩЕНИЙ ---
        cleanupOldMessages();
        
        renderContacts();
        setTimeout(() => { if(Notification.permission==='default') Notification.requestPermission(); }, 3000);
        
        db.ref('messages').orderByChild('timestamp').limitToLast(150).on('child_added', (snap) => {
            const m = snap.val();
            allMessages.push(m);
            if (!isInitialLoad && m.receiver === myId && activeTarget !== m.sender) {
                unreadCounts[m.sender] = (unreadCounts[m.sender] || 0) + 1;
                renderContacts(); playPopSound(); showNotification(users[m.sender].n, m.content);
            }
            if (activeTarget && ((m.sender === myId && m.receiver === activeTarget) || (m.sender === activeTarget && m.receiver === myId))) {
                renderMsg(m.content, m.sender === myId ? 'sent' : 'received', m.timestamp);
            }
        });

        setTimeout(() => { isInitialLoad = false; }, 2000);
        const myStatusRef = db.ref('status/' + myId);
        myStatusRef.set({ online: true, typing_to: null });
        myStatusRef.onDisconnect().remove();
        db.ref('status').on('value', (snap) => { onlineUsers = snap.val() || {}; updateStatusUI(); renderContacts(); });
    }

    function renderContacts() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        for (let id in users) {
            if (id === myId) continue;
            const isOnline = onlineUsers[id] && onlineUsers[id].online;
            const unread = unreadCounts[id] || 0;
            const statusColor = isOnline ? '#25D366' : '#bbb';
            const badgeHtml = unread > 0 ? `<div class="badge">${unread}</div>` : '';
            list.innerHTML += `
                <div class="contact-item" onclick="openChat('${id}')">
                    <div class="avatar" style="border: 2px solid ${statusColor}">${users[id].i}</div>
                    <div style="flex: 1;"><b>${users[id].n}</b><br><small style="color:${statusColor}">${isOnline ? 'в сети' : 'был(а) недавно'}</small></div>
                    ${badgeHtml}
                </div>`;
        }
    }

    function openChat(id) {
        activeTarget = id; 
        unreadCounts[id] = 0; 
        renderContacts();

        document.getElementById('contacts-list').style.display = 'none';
        document.getElementById('chat-window').style.display = 'flex';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('header-name').innerText = users[id].n;
        document.getElementById('header-avatar').innerText = users[id].i;
        
        updateStatusUI();

        const cont = document.getElementById('messages-container'); 
        cont.innerHTML = '';
        
        // Отрисовываем историю
        allMessages.forEach(m => { 
            if ((m.sender === myId && m.receiver === id) || (m.sender === id && m.receiver === myId)) {
                renderMsg(m.content, m.sender === myId ? 'sent' : 'received', m.timestamp);
            } 
        });
        
        // Магия тут: прокручиваем вниз с небольшой задержкой (100мс), 
        // чтобы браузер успел отрисовать все блоки сообщений
        setTimeout(() => {
            cont.scrollTop = cont.scrollHeight;
        }, 100);
    }

    function updateStatusUI() {
        const statusEl = document.getElementById('header-status');
        const typingEl = document.getElementById('typing-indicator');
        if (!activeTarget || !statusEl) return;
        const state = onlineUsers[activeTarget];
        if (state && state.online) {
            if (state.typing_to === myId) {
                typingEl.style.display = 'block'; statusEl.innerText = 'печатает...'; statusEl.style.color = '#008069';
            } else {
                typingEl.style.display = 'none'; statusEl.innerText = 'в сети'; statusEl.style.color = '#00a884';
            }
        } else { typingEl.style.display = 'none'; statusEl.innerText = 'не в сети'; statusEl.style.color = '#667781'; }
    }

    function closeChat() {
        activeTarget = null; document.getElementById('contacts-list').style.display = 'block';
        document.getElementById('chat-window').style.display = 'none'; document.getElementById('back-btn').style.display = 'none';
        document.getElementById('header-name').innerText = 'Семейный Чат';
    }

    const msgInput = document.getElementById('msg-input');
    msgInput.addEventListener('input', () => {
        if (!activeTarget) return; clearTimeout(typingTimer);
        if (!isTypingNow) { isTypingNow = true; db.ref('status/' + myId).update({ typing_to: activeTarget }); }
        typingTimer = setTimeout(() => { isTypingNow = false; db.ref('status/' + myId).update({ typing_to: null }); }, 1500);
    });

    async function sendMsg() {
        const val = msgInput.value.trim(); if (!val || !activeTarget) return;
        msgInput.value = ''; db.ref('messages').push({ sender: myId, receiver: activeTarget, content: val, timestamp: firebase.database.ServerValue.TIMESTAMP });
    }

    function uploadImage(event) {
        const file = event.target.files[0]; if (!file || !activeTarget) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas'); const MAX_WIDTH = 400;
                let width = img.width; let height = img.height;
                if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                db.ref('messages').push({ sender: myId, receiver: activeTarget, content: canvas.toDataURL('image/jpeg', 0.6), timestamp: firebase.database.ServerValue.TIMESTAMP });
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file); event.target.value = '';
    }

    function renderMsg(text, type, time) {
        const cont = document.getElementById('messages-container');
        const t = new Date(time || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div'); 
        div.className = `msg ${type}`;
        
        if (text.startsWith('data:image')) {
            // Добавляем onload="this.closest('#messages-container').scrollTop = this.closest('#messages-container').scrollHeight"
            // Это заставит чат еще раз прыгнуть вниз, когда картинка полностью прогрузится
            div.innerHTML = `<img src="${text}" style="max-width:100%; border-radius:8px; display:block;" onload="this.parentElement.parentElement.scrollTop = this.parentElement.parentElement.scrollHeight">
                             <span class="msg-time">${t}</span>`;
        } else {
            div.innerHTML = `${text.replace(/\n/g, '<br>')} <span class="msg-time">${t}</span>`;
        }
        
        cont.appendChild(div);
        cont.scrollTop = cont.scrollHeight;
    }
function cleanupOldMessages() {
        // Вычисляем время, которое было ровно 7 дней назад
        const DAYS_MS = 3 * 24 * 60 * 60 * 1000; 
        const cutoffTime = Date.now() - DAYS_MS;

        // Ищем в базе все сообщения, время которых меньше (старше), чем наш лимит
        db.ref('messages').orderByChild('timestamp').endAt(cutoffTime).once('value', (snapshot) => {
            snapshot.forEach((childSnapshot) => {
                // Удаляем найденное старое сообщение
                childSnapshot.ref.remove(); 
            });
        });
    }
    // Огромный массив всех основных смайлов

    // Функция открытия/закрытия панели
    function toggleEmojiPicker() {
        const picker = document.getElementById('emoji-picker');
        if (picker.style.display === 'grid') {
            picker.style.display = 'none';
        } else {
            // Отрисовываем смайлы только при первом открытии (для экономии памяти)
            if (picker.innerHTML === '') {
                picker.innerHTML = allEmojis.map(e => `<div class="emoji-item" onclick="addEmoji('${e}')">${e}</div>`).join('');
            }
            picker.style.display = 'grid';
        }
    }

    // Вставка смайла в текст
    function addEmoji(e) { 
        msgInput.value += e; 
    }

    // Закрываем панель смайлов, если пользователь нажал на поле ввода текста
    msgInput.addEventListener('focus', () => {
        document.getElementById('emoji-picker').style.display = 'none';
    });

    // Отправка по Enter
    msgInput.onkeypress = (e) => { 
        if(e.key==='Enter') {
            sendMsg();
            document.getElementById('emoji-picker').style.display = 'none';
        }
    };
